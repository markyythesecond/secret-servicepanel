<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Anime</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/artplayer@5.2.1/dist/artplayer.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#0b0d14; --panel:#11141d; --raised:#1a1f2b; --line:rgba(255,255,255,.07);
  --text:#e6e9f0; --dim:#8c94a8; --accent:#8b5cf6;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:Inter,system-ui,-apple-system,sans-serif; font-size:14px;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:30;height:62px;
  display:flex;align-items:center;gap:14px;padding:0 20px;
  background:rgba(11,13,20,.9);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.2px}
.dot{width:26px;height:26px;border-radius:8px;background:var(--accent);flex:none}
#back{
  display:none;align-items:center;gap:7px;padding:0 14px;height:36px;
  border-radius:9px;background:var(--raised);font-size:13px;font-weight:600;
}
#back:hover{background:#242a38}
#search{
  margin-left:auto;width:min(280px,42vw);height:38px;padding:0 14px;
  border-radius:10px;background:var(--raised);border:1px solid var(--line);
  color:var(--text);font-size:14px;outline:none;
}
#search::placeholder{color:#5f6779}
#search:focus{border-color:var(--accent)}

/* ---------- layout ---------- */
main{padding:24px 20px 80px;max-width:1400px;margin:0 auto}
h2{font-size:19px;font-weight:800;letter-spacing:-.3px;margin:0 0 16px}

.shelf{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.series{cursor:pointer}
.cover{
  position:relative;aspect-ratio:2/3;border-radius:12px;overflow:hidden;
  border:1px solid var(--line);
  display:grid;place-items:center;padding:14px;text-align:center;
  font-weight:800;font-size:15px;line-height:1.3;
  transition:transform .18s,border-color .18s;
}
.series:hover .cover{transform:translateY(-4px);border-color:var(--accent)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge{
  position:absolute;right:8px;top:8px;z-index:2;
  padding:3px 9px;border-radius:99px;background:rgba(0,0,0,.72);
  font-size:11px;font-weight:700;
}
.series h3{margin:9px 0 2px;font-size:13px;font-weight:600;line-height:1.3}
.series p{margin:0;font-size:11px;color:var(--dim)}

/* ---------- episode picker ---------- */
.eps{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.ep{
  display:flex;align-items:center;gap:12px;text-align:left;width:100%;
  padding:11px 13px;border-radius:11px;background:var(--panel);
  border:1px solid var(--line);transition:background .15s,border-color .15s;
}
.ep:hover{background:var(--raised);border-color:rgba(139,92,246,.5)}
.ep.on{background:rgba(139,92,246,.15);border-color:var(--accent)}
.num{
  width:38px;height:38px;border-radius:9px;background:var(--raised);
  display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;
  color:var(--dim);position:relative;overflow:hidden;
}
.ep.on .num{background:var(--accent);color:#fff}
.bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
.ep .t{font-size:13px;font-weight:600;line-height:1.3;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ep .s{font-size:11px;color:var(--dim);margin-top:2px}

/* ---------- player ---------- */
#stage{background:#000;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
#player{width:100%;aspect-ratio:16/9}
.bar-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 26px}
.bar-row h2{margin:0;flex:1;min-width:200px}
.btn{padding:0 16px;height:38px;border-radius:9px;background:var(--raised);font-size:13px;font-weight:600}
.btn:hover{background:#242a38}
.btn.pri{background:var(--accent);color:#fff}
.btn.pri:hover{background:#7c4dee}
.btn:disabled{opacity:.35;pointer-events:none}

.note{
  margin-top:14px;padding:13px 15px;border-radius:10px;
  background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.3);
  color:#fda4af;font-size:13px;line-height:1.55;display:none;
}
.note.show{display:block}
.empty{text-align:center;padding:70px 20px;color:var(--dim);line-height:1.6}
.empty b{color:var(--text)}

#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);z-index:60;
  padding:12px 20px;border-radius:11px;background:var(--raised);
  border:1px solid var(--line);font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:.2s;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:600px){
  main{padding:18px 14px 70px}
  .shelf{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:13px}
  .eps{grid-template-columns:1fr}
  #stage{border-radius:0;margin:0 -14px;border-left:0;border-right:0}
}
</style>
</head>
<body>

<header>
  <button id="back">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    Back
  </button>
  <div class="brand"><span class="dot"></span><span id="brandName">My Anime</span></div>
  <input id="search" type="search" placeholder="Search">
</header>

<main>
  <!-- series picker -->
  <section id="viewSeries">
    <h2>Series</h2>
    <div class="shelf" id="shelf"></div>
    <div class="empty" id="noSeries" style="display:none"></div>
  </section>

  <!-- episode picker -->
  <section id="viewEps" style="display:none">
    <h2 id="epsTitle"></h2>
    <div class="eps" id="epList"></div>
  </section>

  <!-- player -->
  <section id="viewPlay" style="display:none">
    <div id="stage"><div id="player"></div></div>
    <div class="bar-row">
      <h2 id="nowTitle"></h2>
      <button class="btn" id="prev">Previous</button>
      <button class="btn pri" id="next">Next episode</button>
      <button class="btn" id="toEps">All episodes</button>
    </div>
    <div class="note" id="note"></div>
  </section>
</main>

<div id="toast"></div>

<script>
(function () {
"use strict";

const L = window.LIBRARY || {};
const $ = s => document.querySelector(s);
const PROGRESS = "anime:progress";

let series = [], current = null, ep = null, art = null, lastKey = "";

/* -------- helpers -------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

// Encode each path segment but keep the slashes as separators.
function url(file) {
  if (/^https?:\/\//i.test(file)) return file;
  const base = (L.baseUrl || "").replace(/\/+$/, "");
  return base + "/" + String(file).split("/").map(encodeURIComponent).join("/");
}

function cover(title) {
  let h = 0;
  for (let i = 0; i < title.length; i++) h = (h * 31 + title.charCodeAt(i)) >>> 0;
  return `linear-gradient(145deg,hsl(${h % 360} 52% 30%),hsl(${(h + 55) % 360} 58% 18%))`;
}

const clock = s => isFinite(s)
  ? Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0") : "0:00";

function readProgress() {
  try { return JSON.parse(localStorage.getItem(PROGRESS)) || {}; } catch (e) { return {}; }
}
function writeProgress(key, t, d) {
  if (!d || !isFinite(t)) return;
  const all = readProgress();
  if (t / d > 0.92) delete all[key]; else all[key] = { t, d };
  try { localStorage.setItem(PROGRESS, JSON.stringify(all)); } catch (e) {}
}
const keyOf = (s, e) => s.title + "::" + e.file;

let tt;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 2600);
}

/* -------- normalise config -------- */
// Episodes may be plain strings or objects; make them all objects.
function build() {
  series = (L.series || []).map(s => ({
    title: s.title || "Untitled",
    poster: s.poster || "",
    episodes: (s.episodes || []).map((e, i) => {
      if (typeof e === "string") {
        const name = e.split("/").pop().replace(/\.[^.]+$/, "");
        return { n: i + 1, title: name, file: e };
      }
      return { n: e.n ?? i + 1, title: e.title || "", file: e.file };
    }).filter(e => e.file)
  })).filter(s => s.episodes.length);
}

/* -------- views -------- */
function show(which) {
  $("#viewSeries").style.display = which === "series" ? "" : "none";
  $("#viewEps").style.display    = which === "eps"    ? "" : "none";
  $("#viewPlay").style.display   = which === "play"   ? "" : "none";
  $("#back").style.display       = which === "series" ? "none" : "flex";
  $("#search").style.display     = which === "series" ? "" : "none";
  if (which !== "play" && art) { try { art.pause(); } catch (e) {} }
  window.scrollTo({ top: 0 });
}

function renderSeries(filter = "") {
  const q = filter.trim().toLowerCase();
  const list = series.filter(s => !q || s.title.toLowerCase().includes(q));
  const box = $("#shelf");
  box.innerHTML = "";

  const none = $("#noSeries");
  none.style.display = list.length ? "none" : "block";
  if (!list.length) {
    none.innerHTML = series.length
      ? `Nothing matches <b>${esc(filter)}</b>.`
      : `No series yet.<br>Open <b>config.js</b> and add them.`;
    return;
  }

  list.forEach(s => {
    const el = document.createElement("div");
    el.className = "series";
    el.innerHTML =
      `<div class="cover" style="background:${cover(s.title)}">
         ${s.poster ? `<img src="${esc(s.poster)}" alt="" loading="lazy" onerror="this.remove()">` : esc(s.title)}
         <span class="badge">${s.episodes.length} ep</span>
       </div>
       <h3>${esc(s.title)}</h3>
       <p>${s.episodes.length} episodes</p>`;
    el.onclick = () => openSeries(s);
    box.appendChild(el);
  });
}

function openSeries(s) {
  current = s;
  $("#epsTitle").textContent = s.title;
  renderEps();
  show("eps");
}

function renderEps() {
  const all = readProgress();
  const box = $("#epList");
  box.innerHTML = "";

  current.episodes.forEach(e => {
    const p = all[keyOf(current, e)];
    const pct = p ? Math.min(100, (p.t / p.d) * 100) : 0;
    const b = document.createElement("button");
    b.className = "ep" + (ep && ep.file === e.file ? " on" : "");
    b.innerHTML =
      `<span class="num">${e.n}${pct ? `<span class="bar" style="width:${pct}%"></span>` : ""}</span>
       <span style="min-width:0">
         <span class="t" style="display:block">${esc(e.title || "Episode " + e.n)}</span>
         <span class="s">${p ? `${Math.round(pct)}% watched` : "Not watched"}</span>
       </span>`;
    b.onclick = () => play(e);
    box.appendChild(b);
  });
}

/* -------- playback -------- */
function play(episode) {
  ep = episode;
  show("play");

  $("#nowTitle").textContent = `${current.title} — ${ep.title || "Episode " + ep.n}`;
  $("#note").classList.remove("show");

  const i = current.episodes.indexOf(ep);
  $("#prev").disabled = i <= 0;
  $("#next").disabled = i >= current.episodes.length - 1;

  const key = current ? keyOf(current, ep) : "";
  const saved = readProgress()[key];

  // Flush the outgoing episode's position before tearing the player down,
  // otherwise a short view is lost (timeupdate only saves every ~5s).
  if (art) {
    try { if (art.currentTime > 5) writeProgress(lastKey, art.currentTime, art.duration); } catch (e) {}
    try { art.destroy(false); } catch (e) {}
    art = null;
  }
  lastKey = key;

  art = new Artplayer({
    container: "#player",
    url: url(ep.file),
    volume: 1,
    autoplay: true,
    pip: true,
    setting: true,
    playbackRate: true,      // 0.5x - 2.0x
    fullscreen: true,
    fullscreenWeb: true,
    miniProgressBar: true,
    autoOrientation: true,
    theme: "#8b5cf6",
    moreVideoAttr: { playsInline: true },
    controls: [
      { name: "b10", position: "left", index: 12, tooltip: "Back 10s",
        html: '<span style="font-size:12px;font-weight:700">-10</span>',
        click: () => { art.currentTime = Math.max(0, art.currentTime - 10); } },
      { name: "f10", position: "left", index: 13, tooltip: "Forward 10s",
        html: '<span style="font-size:12px;font-weight:700">+10</span>',
        click: () => { art.currentTime = Math.min(art.duration, art.currentTime + 10); } }
    ]
  });

  art.on("ready", () => {
    if (saved && saved.t > 15) { art.currentTime = saved.t; toast("Resumed at " + clock(saved.t)); }
  });

  let n = 0;
  art.on("video:timeupdate", () => {
    if (++n % 20) return;                     // save roughly every 5s
    writeProgress(key, art.currentTime, art.duration);
  });

  // Pausing is a strong signal the viewer is stopping, so save immediately.
  art.on("video:pause", () => writeProgress(key, art.currentTime, art.duration));
  window.addEventListener("beforeunload", () => {
    if (art) writeProgress(key, art.currentTime, art.duration);
  });

  art.on("video:ended", () => {
    writeProgress(key, 0, art.duration);
    const nx = current.episodes[current.episodes.indexOf(ep) + 1];
    if (nx) play(nx);
  });

  // The usual cause is codecs the browser can't decode, so say so plainly.
  art.on("error", () => {
    $("#note").innerHTML =
      "This file would not play. Usually that means the video inside is HEVC / x265 / 10-bit, " +
      "which browsers cannot decode — or the NAS is not sending CORS headers. " +
      "Open the browser console (F12) to see which.";
    $("#note").classList.add("show");
  });
}

function step(d) {
  const i = current.episodes.indexOf(ep) + d;
  if (current.episodes[i]) play(current.episodes[i]);
}

/* -------- wire up -------- */
$("#back").onclick   = () => { if ($("#viewPlay").style.display !== "none") { renderEps(); show("eps"); } else show("series"); };
$("#toEps").onclick  = () => { renderEps(); show("eps"); };
$("#prev").onclick   = () => step(-1);
$("#next").onclick   = () => step(1);
$("#search").oninput = e => renderSeries(e.target.value);

document.addEventListener("keydown", e => {
  if (!art || $("#viewPlay").style.display === "none") return;
  if (/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === " " || k === "k") { e.preventDefault(); art.toggle(); }
  if (k === "arrowright") { e.preventDefault(); art.currentTime = Math.min(art.duration, art.currentTime + 10); }
  if (k === "arrowleft")  { e.preventDefault(); art.currentTime = Math.max(0, art.currentTime - 10); }
  if (k === "f") art.fullscreen = !art.fullscreen;
  if (k === "n") step(1);
});

/* -------- start -------- */
$("#brandName").textContent = L.siteTitle || "My Anime";
document.title = L.siteTitle || "My Anime";
build();
renderSeries();
show("series");
})();
</script>
</body>
</html>
