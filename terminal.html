<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Terminal — Secret Service Panel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400;1,500&family=JetBrains+Mono:wght@400;700&display=swap');

  :root {
    --bg: #08070a;
    --bg-2: #0f0d12;
    --fg: #ededed;
    --gray: #8a8590;
    --muted: rgba(237, 237, 237, 0.5);
    --accent: #6b3fa0;
    --accent-2: #9d6cd1;
    --accent-glow: rgba(107, 63, 160, 0.45);
    --border: rgba(237, 237, 237, 0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'JetBrains Mono', monospace;
    overflow-x: hidden;
    cursor: crosshair;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(circle at 25% 30%, rgba(255,255,255,0.018) 1px, transparent 1px),
      radial-gradient(circle at 75% 70%, rgba(255,255,255,0.018) 1px, transparent 1px);
    background-size: 3px 3px, 5px 5px;
    z-index: 1000;
    mix-blend-mode: overlay;
  }

  /* Scanlines effect for terminal feel */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 2px,
      rgba(157, 108, 209, 0.025) 2px,
      rgba(157, 108, 209, 0.025) 3px
    );
    z-index: 999;
    mix-blend-mode: overlay;
  }

  ::selection { background: var(--accent); color: var(--fg); }

  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 1.5rem 3rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 100;
    backdrop-filter: blur(8px);
    background: rgba(8, 7, 10, 0.7);
    border-bottom: 1px solid var(--border);
  }
  nav .logo {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: 1.1rem;
    letter-spacing: 0.4em;
    text-decoration: none;
    color: var(--fg);
  }
  nav .logo span { color: var(--accent-2); }
  nav ul { list-style: none; display: flex; gap: 2.5rem; }
  nav a {
    color: var(--fg);
    text-decoration: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    opacity: 0.7;
    transition: all 0.2s;
  }
  nav a::before {
    content: '✦ ';
    color: var(--accent-2);
    opacity: 0;
    transition: opacity 0.2s;
  }
  nav a:hover { opacity: 1; }
  nav a:hover::before, nav a.active::before { opacity: 1; }
  nav a.active { opacity: 1; color: var(--accent-2); }

  .terminal-wrap {
    max-width: 1000px;
    margin: 0 auto;
    padding: 8rem 2rem 4rem;
    min-height: 100vh;
  }

  .terminal {
    background: var(--bg-2);
    border: 1px solid var(--border);
    box-shadow: 0 0 60px var(--accent-glow);
    min-height: 70vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Terminal window chrome */
  .term-bar {
    background: rgba(255,255,255,0.04);
    border-bottom: 1px solid var(--border);
    padding: 0.5rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.7rem;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .term-bar .dots {
    display: flex;
    gap: 0.4rem;
  }
  .term-bar .dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.5;
  }
  .term-bar .dot:nth-child(2) { background: var(--accent-2); opacity: 0.7; }
  .term-bar .dot:nth-child(3) { background: var(--fg); opacity: 0.4; }
  .term-bar .title {
    flex: 1;
    text-align: center;
    color: var(--accent-2);
  }
  .term-bar .meta {
    font-size: 0.6rem;
    letter-spacing: 0.15em;
  }

  .term-body {
    flex: 1;
    padding: 1.5rem;
    overflow-y: auto;
    font-size: 0.85rem;
    line-height: 1.55;
    cursor: text;
  }

  .term-body::-webkit-scrollbar { width: 6px; }
  .term-body::-webkit-scrollbar-track { background: transparent; }
  .term-body::-webkit-scrollbar-thumb { background: var(--border); }
  .term-body::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  .line { margin-bottom: 0.15rem; word-wrap: break-word; }
  .line.prompt-line { display: flex; gap: 0.5rem; align-items: baseline; }
  .line.prompt-line .prompt-prefix { color: var(--accent-2); flex-shrink: 0; }
  .line.prompt-line .cmd { color: var(--fg); }

  .line.output { color: var(--gray); padding-left: 0; margin-bottom: 0.3rem; }
  .line.output.success { color: #3dd676; }
  .line.output.error   { color: #d63a3a; }
  .line.output.warn    { color: #e8a93d; }
  .line.output.info    { color: var(--accent-2); }
  .line.output.dim     { color: var(--muted); font-size: 0.75rem; }

  .ascii-art {
    color: var(--accent-2);
    font-size: 0.65rem;
    line-height: 1.05;
    white-space: pre;
    margin: 0.5rem 0 1rem;
    text-shadow: 0 0 8px var(--accent-glow);
  }

  .help-grid {
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 0.2rem 1.5rem;
    margin: 0.5rem 0;
    font-size: 0.8rem;
  }
  .help-grid .cmd-name { color: var(--accent-2); }
  .help-grid .cmd-desc { color: var(--gray); }

  /* Input row */
  .input-row {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    padding: 0.5rem 1.5rem 1.2rem;
    border-top: 1px solid var(--border);
    background: rgba(0,0,0,0.2);
  }
  .input-row .prompt-prefix {
    color: var(--accent-2);
    font-size: 0.85rem;
    flex-shrink: 0;
  }
  .input-row input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--fg);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    outline: none;
    caret-color: var(--accent-2);
    padding: 0.3rem 0;
  }
  .input-row .cursor {
    display: inline-block;
    width: 8px;
    height: 14px;
    background: var(--accent-2);
    animation: blink 1s steps(2) infinite;
    vertical-align: middle;
    margin-left: 2px;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }

  /* Boot animation */
  .boot {
    color: var(--accent-2);
    margin-bottom: 0.1rem;
    opacity: 0;
    animation: bootIn 0.2s forwards;
  }

  @keyframes bootIn {
    to { opacity: 1; }
  }

  .typed::after {
    content: '▊';
    color: var(--accent-2);
    animation: blink 1s steps(2) infinite;
    margin-left: 2px;
  }

  /* Konami flash */
  .konami {
    animation: konamiFlash 0.6s;
  }
  @keyframes konamiFlash {
    0% { filter: hue-rotate(0); }
    25% { filter: hue-rotate(90deg) brightness(1.5); }
    50% { filter: hue-rotate(180deg) brightness(2); }
    75% { filter: hue-rotate(270deg) brightness(1.5); }
    100% { filter: hue-rotate(0); }
  }

  @media (max-width: 800px) {
    nav { padding: 1rem 1.5rem; }
    nav ul { gap: 1.2rem; }
    .terminal-wrap { padding: 7rem 1rem 2rem; }
    .term-body { font-size: 0.75rem; padding: 1rem; }
    .input-row { padding: 0.5rem 1rem 1rem; }
    .ascii-art { font-size: 0.5rem; }
    .help-grid { grid-template-columns: 100px 1fr; font-size: 0.7rem; }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">S<span>·</span>S<span>·</span>P</a>
  <ul>
    <li><a href="index.html#features">Features</a></li>
    <li><a href="database.html">Database</a></li>
    <li><a href="credits.html">Credits</a></li>
    <li><a href="terminal.html" class="active">Terminal</a></li>
    <li><a href="#">Discord</a></li>
  </ul>
</nav>

<div class="terminal-wrap">
  <div class="terminal" id="terminal">
    <div class="term-bar">
      <div class="dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <div class="title">S.S.P. // SECURE TERMINAL</div>
      <div class="meta">TTY-047</div>
    </div>

    <div class="term-body" id="termBody">
      <!-- output appears here -->
    </div>

    <div class="input-row">
      <span class="prompt-prefix">visitor@ssp:~$</span>
      <input type="text" id="termInput" autocomplete="off" spellcheck="false" autofocus>
    </div>
  </div>
</div>

<script src="theme.js"></script>
<script src="ui.js"></script>
<script>
  const termBody = document.getElementById('termBody');
  const termInput = document.getElementById('termInput');
  const terminal = document.getElementById('terminal');

  const history = [];
  let historyIdx = -1;

  function append(html, cls = '') {
    const div = document.createElement('div');
    div.className = 'line ' + (cls ? 'output ' + cls : 'output');
    div.innerHTML = html;
    termBody.appendChild(div);
    termBody.scrollTop = termBody.scrollHeight;
    return div;
  }

  function appendPromptLine(cmd) {
    const div = document.createElement('div');
    div.className = 'line prompt-line';
    div.innerHTML = `<span class="prompt-prefix">visitor@ssp:~$</span><span class="cmd">${escapeHtml(cmd)}</span>`;
    termBody.appendChild(div);
    termBody.scrollTop = termBody.scrollHeight;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  // ============ BOOT SEQUENCE ============
  const bootLines = [
    { text: '[ OK ] Initializing S.S.P. terminal v2.4.7', delay: 80, cls: 'success' },
    { text: '[ OK ] Loading encryption modules...', delay: 100, cls: 'success' },
    { text: '[ OK ] Spoofing hardware signatures...', delay: 120, cls: 'success' },
    { text: '[ OK ] Establishing secure channel...', delay: 100, cls: 'success' },
    { text: '[ OK ] Connection routed through 47 nodes', delay: 100, cls: 'success' },
    { text: '[ -- ] Welcome, operative.', delay: 200, cls: 'info' },
    { text: '', delay: 100, cls: '' },
    { text: 'Type <span style="color:var(--accent-2)">help</span> to see available commands.', delay: 0, cls: 'dim' },
    { text: '', delay: 0, cls: '' }
  ];

  let bootIdx = 0;
  function boot() {
    if (bootIdx >= bootLines.length) {
      termInput.focus();
      return;
    }
    const line = bootLines[bootIdx];
    append(line.text, line.cls);
    bootIdx++;
    setTimeout(boot, line.delay);
  }

  // ============ COMMANDS ============
  const banner = `   ███████  ███████  ██████
   ██       ██       ██  ██
   ███████  ███████  ██████
        ██       ██  ██
   ███████  ███████  ██
   SECRET · SERVICE · PANEL`;

  const commands = {
    help: () => {
      append('Available commands:', 'info');
      append(`
        <div class="help-grid">
          <span class="cmd-name">help</span>           <span class="cmd-desc">Show this list</span>
          <span class="cmd-name">about</span>          <span class="cmd-desc">About S.S.P.</span>
          <span class="cmd-name">whoami</span>         <span class="cmd-desc">Who are you?</span>
          <span class="cmd-name">features</span>       <span class="cmd-desc">List all mod features</span>
          <span class="cmd-name">database</span>       <span class="cmd-desc">Open the player database</span>
          <span class="cmd-name">credits</span>        <span class="cmd-desc">Show credits page</span>
          <span class="cmd-name">download</span>       <span class="cmd-desc">Get the latest build</span>
          <span class="cmd-name">discord</span>        <span class="cmd-desc">Join the Discord</span>
          <span class="cmd-name">status</span>         <span class="cmd-desc">Service status</span>
          <span class="cmd-name">version</span>        <span class="cmd-desc">Current version info</span>
          <span class="cmd-name">date</span>           <span class="cmd-desc">Current date and time</span>
          <span class="cmd-name">echo [text]</span>    <span class="cmd-desc">Print text</span>
          <span class="cmd-name">theme [name]</span>   <span class="cmd-desc">Change theme (violet/crimson/verdant/ivory)</span>
          <span class="cmd-name">clear</span>          <span class="cmd-desc">Clear the screen</span>
          <span class="cmd-name">home</span>           <span class="cmd-desc">Return to main site</span>
          <span class="cmd-name">exit</span>           <span class="cmd-desc">Close the terminal</span>
        </div>
      `, 'dim');
    },

    about: () => {
      append(`<pre class="ascii-art">${banner}</pre>`);
      append('S.S.P. — a Gorilla Tag mod menu for monkeys who play smarter.');
      append('Quiet injection. Clean UI. Every mod you actually want.');
      append('');
      append('Built since: MMXXVI', 'dim');
      append('Operators: classified', 'dim');
      append('Status: operational', 'success');
    },

    whoami: () => {
      append('You are: <span style="color:var(--accent-2)">visitor</span>', 'info');
      append('Privilege level: 1 (read-only)', 'dim');
      append('Session: secure · encrypted', 'dim');
      append('IP: <span style="color:var(--accent-2)">REDACTED</span>', 'dim');
      append('Location: <span style="color:var(--accent-2)">REDACTED</span>', 'dim');
      append('');
      append('To increase your privilege level, join the Discord.', 'warn');
    },

    features: () => {
      append('S.S.P. // FEATURE LIST', 'info');
      append('');
      append('▸ Movement      — speed, fly, noclip, platforms, long arms');
      append('▸ Tag Mods      — range extender, infect all, freeze, lava, ghost');
      append('▸ Player ESP    — names, distances, IDs, role highlighting');
      append('▸ Cosmetics     — unlock all, custom holdables, Cosmetic X');
      append('▸ Room Tools    — private joining, lobby spy, code grabber');
      append('▸ Stealth       — manual mapped DLL, randomized signatures');
      append('');
      append('See <a href="index.html#features" style="color:var(--accent-2)">Features page</a> for details.', 'dim');
    },

    database: () => {
      append('Opening player database...', 'info');
      setTimeout(() => window.location.href = 'database.html', 600);
    },

    credits: () => {
      append('Opening credits...', 'info');
      setTimeout(() => window.location.href = 'credits.html', 600);
    },

    download: () => {
      append('[ -- ] Preparing download link...', 'info');
      append('[ OK ] v2.4.7 ready', 'success');
      append('');
      append('Click here: <a href="index.html#download" style="color:var(--accent-2)">↓ download v2.4.7</a>');
    },

    discord: () => {
      append('Discord invite: <span style="color:var(--accent-2)">coming soon</span>', 'warn');
      append('Check back later or ask in the comments.', 'dim');
    },

    status: () => {
      append('SERVICE STATUS', 'info');
      append('────────────────────────');
      append('▸ Site:         <span style="color:#3dd676">OPERATIONAL</span>');
      append('▸ Menu:         <span style="color:#3dd676">OPERATIONAL</span>');
      append('▸ Discord:      <span style="color:#3dd676">OPERATIONAL</span>');
      append('▸ Detections:   <span style="color:#3dd676">NONE (last 30d)</span>');
      append('────────────────────────');
      append('All systems nominal.', 'dim');
    },

    version: () => {
      append('S.S.P. v2.4.7 (build 0921)', 'info');
      append('Compatibility: GTAG latest', 'dim');
      append('Platform: PCVR + Quest standalone', 'dim');
      append('Last updated: 09 May 2026', 'dim');
    },

    date: () => {
      append(new Date().toString(), 'info');
    },

    echo: (args) => {
      append(escapeHtml(args.join(' ')) || '');
    },

    theme: (args) => {
      const name = (args[0] || '').toLowerCase();
      const valid = ['violet', 'crimson', 'verdant', 'ivory'];
      if (!name) {
        append('Usage: theme [name]', 'warn');
        append('Available: ' + valid.join(', '), 'dim');
        return;
      }
      if (!valid.includes(name)) {
        append('Unknown theme: ' + name, 'error');
        append('Available: ' + valid.join(', '), 'dim');
        return;
      }
      localStorage.setItem('ssp-theme', name);
      append('Theme set to <span style="color:var(--accent-2)">' + name + '</span>. Reloading...', 'success');
      setTimeout(() => window.location.reload(), 600);
    },

    clear: () => {
      termBody.innerHTML = '';
    },

    cls: () => commands.clear(),

    home: () => {
      append('Returning home...', 'info');
      setTimeout(() => window.location.href = 'index.html', 600);
    },

    exit: () => {
      append('Closing terminal...', 'warn');
      append('Goodbye, operative.', 'dim');
      setTimeout(() => window.location.href = 'index.html', 1200);
    },

    // ============ EASTER EGGS ============
    sudo: (args) => {
      if (args[0] === 'rm' && args[1] === '-rf' && args[2] === '/') {
        append('nice try.', 'error');
        return;
      }
      append('visitor is not in the sudoers file. This incident will be reported.', 'error');
    },

    hack: () => {
      append('[ -- ] Initiating hack sequence...', 'info');
      const fakeIPs = ['172.16.4.99', '10.0.0.1', '192.168.1.47', '203.0.113.42'];
      let i = 0;
      const interval = setInterval(() => {
        if (i >= fakeIPs.length) {
          clearInterval(interval);
          append('[ OK ] Access denied. (you wish)', 'error');
          return;
        }
        append(`Trying ${fakeIPs[i]}... <span style="color:#d63a3a">FAILED</span>`, 'dim');
        i++;
      }, 400);
    },

    matrix: () => {
      append('Wake up, monkey.', 'info');
      append('The Matrix has you.', 'info');
      append('Follow the white banana.', 'info');
    },

    ls: () => {
      append('index.html    database.html    credits.html');
      append('terminal.html theme.js         ui.js');
      append('hero.png      CNAME            .secret/', 'dim');
    },

    cat: (args) => {
      if (args[0] === '.secret') {
        append('cat: .secret: Is a directory', 'error');
        return;
      }
      append('cat: ' + (args[0] || 'missing operand') + ': Permission denied', 'error');
    },

    cd: (args) => {
      if (args[0] === '..') {
        append('Already at root.', 'warn');
        return;
      }
      if (args[0] === '.secret') {
        append('[ !! ] Access requires clearance level 6', 'error');
        return;
      }
      append('cd: no such directory: ' + (args[0] || ''), 'error');
    },

    rm: () => append('rm: Permission denied. This is a museum.', 'error'),

    coffee: () => {
      append('Brewing coffee...', 'info');
      setTimeout(() => append('☕ ready.', 'success'), 800);
    },

    banana: () => {
      append('🍌 you have been awarded one (1) banana.', 'success');
    },

    secret: () => {
      append('There is no secret.', 'dim');
      append('...', 'dim');
      append('OK fine, try the konami code.', 'warn');
    },
  };

  // ============ EXECUTE ============
  function execute(input) {
    const trimmed = input.trim();
    if (!trimmed) return;

    appendPromptLine(trimmed);

    history.unshift(trimmed);
    if (history.length > 50) history.pop();
    historyIdx = -1;

    const parts = trimmed.split(/\s+/);
    const cmd = parts[0].toLowerCase();
    const args = parts.slice(1);

    if (commands[cmd]) {
      commands[cmd](args);
    } else {
      append(`command not found: ${escapeHtml(cmd)}`, 'error');
      append(`Type <span style="color:var(--accent-2)">help</span> for available commands.`, 'dim');
    }
    append('');
  }

  // ============ INPUT HANDLING ============
  termInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      execute(termInput.value);
      termInput.value = '';
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (history.length === 0) return;
      historyIdx = Math.min(historyIdx + 1, history.length - 1);
      termInput.value = history[historyIdx];
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      historyIdx = Math.max(historyIdx - 1, -1);
      termInput.value = historyIdx === -1 ? '' : history[historyIdx];
    } else if (e.key === 'l' && e.ctrlKey) {
      e.preventDefault();
      commands.clear();
    }
  });

  // Click anywhere in terminal focuses input
  terminal.addEventListener('click', (e) => {
    if (e.target.tagName !== 'A') termInput.focus();
  });

  // ============ KONAMI CODE ============
  const konami = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
  let konamiIdx = 0;
  document.addEventListener('keydown', (e) => {
    if (document.activeElement === termInput) return; // don't interfere with typing
    if (e.key.toLowerCase() === konami[konamiIdx].toLowerCase()) {
      konamiIdx++;
      if (konamiIdx === konami.length) {
        document.body.classList.add('konami');
        append('', 'dim');
        append('▓▓▓ KONAMI ACCEPTED ▓▓▓', 'info');
        append('Privilege level: 6 (admin)', 'success');
        append('You are now part of the inner circle.', 'success');
        append('');
        setTimeout(() => document.body.classList.remove('konami'), 600);
        konamiIdx = 0;
      }
    } else {
      konamiIdx = 0;
    }
  });

  // ============ BOOT ============
  boot();
</script>

</body>
</html>
